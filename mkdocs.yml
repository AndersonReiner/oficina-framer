site_name: Oficina de Prototipacao com Framer
site_description: Material de apoio, roteiro e ambiente interativo para uma oficina introdutoria sobre prototipacao de interfaces com Framer.
site_author: Anderson
site_url: https://andersonreiner.github.io/oficina-framer/

theme:
  name: material
  language: pt-BR
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Alternar para modo escuro
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Alternar para modo claro
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.footer
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight
    - search.suggest
  font:
    text: Roboto
    code: Roboto Mono

extra_css:
  - stylesheets/workshop.css

copyright: Copyright &copy; 2026 Anderson Reiner

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/AndersonReiner/oficina-framer
      name: Repositorio da oficina no GitHub
    - icon: fontawesome/solid/display
      link: https://andersonreiner.github.io/oficina-framer/
      name: Pagina publicada da oficina
    - icon: fontawesome/solid/pen-ruler
      link: https://www.framer.com/
      name: Framer

nav:
  - Inicio: index.md
  - Roteiro: roteiro.md
  - Preparacao: preparacao.md
  - Atividade: atividade.md
  - Referencias: referencias.md

plugins:
  - search:
      lang: pt

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.details
  - pymdownx.superfences
