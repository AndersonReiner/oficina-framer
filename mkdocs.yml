site_name: Oficina de Prototipacao com Framer
site_description: Material de apoio, roteiro e ambiente interativo para uma oficina introdutoria sobre prototipacao de interfaces com Framer.
site_author: Anderson

theme:
  name: material
  language: pt-BR
  palette:
    - scheme: default
      primary: black
      accent: grey
      toggle:
        icon: material/weather-night
        name: Alternar para modo escuro
    - scheme: slate
      primary: black
      accent: grey
      toggle:
        icon: material/weather-sunny
        name: Alternar para modo claro
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - content.code.copy
  font:
    text: Roboto
    code: Roboto Mono

extra_css:
  - stylesheets/extra.css

nav:
  - Inicio: index.md
  - Comparacao:
      - Documentacao limpa: documentacao-limpa.md
      - Landing de oficina: landing-oficina.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
