site_name: Oficina de Prototipacao com Framer
site_description: Material de apoio, roteiro e ambiente interativo para uma oficina introdutoria sobre prototipacao de interfaces com Framer.
site_author: Anderson
site_url: https://andersonreiner.github.io/oficina-framer/

theme:
  name: material
  language: pt-BR
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Alternar para modo escuro
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Alternar para modo claro
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight
    - search.suggest
  font:
    text: Roboto
    code: Roboto Mono

extra_css:
  - stylesheets/workshop.css

copyright: Copyright &copy; 2026 Anderson Reiner

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/AndersonReiner
      name: Anderson Reiner no GitHub
    - icon: fontawesome/brands/github
      link: https://github.com/gustavo-patricio
      name: Gustavo Patrick no GitHub
    - icon: fontawesome/solid/circle-info
      link: https://squidfunk.github.io/mkdocs-material/
      name: MkDocs Material

nav:
  - Apresentacao: apresentacao.md
  - Inicio: index.md
  - Roteiro: roteiro.md
  - Preparacao: preparacao.md
  - Modulos:
      - Modulo 1 - Introducao: modulo-1-introducao.md
      - Modulo 2 - Framer: modulo-2-framer.md
      - Modulo 3 - Desenvolvimento: modulo-3-desenvolvimento.md
      - Modulo 4 - Pratica: modulo-4-pratica.md
  - Atividade: atividade.md
  - Referencias: referencias.md

plugins:
  - search:
      lang: pt

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.details
  - pymdownx.superfences
